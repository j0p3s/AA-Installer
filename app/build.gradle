plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def ksFile = System.getenv('AAI_KEYSTORE')

android {
    namespace 'io.github.j0p3s.aainstaller'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.j0p3s.aainstaller'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '1.4.0'
    }

    buildFeatures {
        aidl true
        compose true
        buildConfig true
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('AAI_KS_PASS')
                keyAlias System.getenv('AAI_KEY_ALIAS')
                keyPassword System.getenv('AAI_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile) signingConfig signingConfigs.release
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all { systemProperty 'robolectric.graphicsMode', 'NATIVE'; systemProperty 'roborazzi.test.record', 'true' }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    packaging {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    // Car patching, ported from CarBridge (GPL-3.0, github.com/jmwerk/CarBridge)
    implementation 'io.github.reandroid:ARSCLib:1.4.0'
    implementation 'com.android.tools.build:apksig:9.5.1'
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18.1'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.79.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.79.0'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
