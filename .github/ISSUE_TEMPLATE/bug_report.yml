name: Bug report
description: Something doesn't work in AA Installer
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please read [Troubleshooting](https://github.com/j0p3s/AA-Installer/blob/main/docs/TROUBLESHOOTING.md) first.
        Requests to make one specific app work in Android Auto usually can't be fixed in AA Installer.
  - type: input
    id: version
    attributes:
      label: AA Installer version
      placeholder: "1.4.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "RedMagic 10S Pro, Android 16"
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: Shell access
      options: [Shizuku, Root, Neither]
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: What were you doing?
      options: [Installing an APK, Installing with car patch, Car copy, Fix apps, Something else]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      description: Copy it from the progress panel, the log (list icon, top right) or the crash dialog.
      render: text
